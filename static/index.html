<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threaddit</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="topbar">
  <a class="brand" href="#/">Threaddit</a>
  <nav id="nav" aria-label="Main"></nav>
  <form id="searchform" role="search" class="hidden">
    <label for="searchbox" class="sr">Search</label>
    <input id="searchbox" type="search" placeholder="Search areas, threads, messages" maxlength="200">
  </form>
  <div id="whoami"></div>
</header>
<main id="main" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Threaddit needs JavaScript.</noscript>
<script src="/app.js"></script>
</body>
</html>
