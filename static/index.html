<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threaddit</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="anon">
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="sidebar glass" id="sidebar" aria-label="Sidebar">
    <a class="brand" href="#/"><i aria-hidden="true"></i><span>Threaddit</span></a>
    <button id="searchbtn" class="search" type="button" aria-haspopup="dialog" aria-label="Search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="tx" aria-hidden="true">Search</span>
      <kbd aria-hidden="true">⌘K</kbd>
    </button>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="sb-foot">
      <div id="whoami"></div>
      <div class="seg seg-theme" id="themeseg" role="radiogroup" aria-label="Appearance"></div>
    </div>
  </aside>
  <div class="main">
    <header class="toolbar glass" id="toolbar">
      <div class="bartitle" id="bartitle"></div>
      <span class="sp"></span>
      <button class="gbtn round" id="inspbtn" type="button" aria-pressed="false" aria-label="Toggle inspector" title="Toggle inspector" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2.5"/><path d="M10 3v10"/></svg></button>
      <button class="gbtn primary" id="newbtn" type="button" aria-haspopup="dialog" aria-expanded="false">＋ New thread</button>
    </header>
    <div class="scroll" id="scroll"><main id="main" class="col" tabindex="-1"></main></div>
  </div>
</div>
<aside class="insp glass" id="insp" aria-label="Thread inspector" hidden></aside>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Threaddit needs JavaScript.</noscript>
<script src="/app.js"></script>
</body>
</html>
