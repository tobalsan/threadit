<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threaddit — Threaddit design mock</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --accent:#0071e3;--link:#0059b8;--orange:#b35400;--purple:#8a3fc9;--red:#c9302c;
  --text:#1d1d1f;--text2:rgba(29,29,31,.68);--text3:rgba(29,29,31,.5);
  --card:#ffffff;--card2:#f4f4f7;--sep:rgba(0,0,0,.09);--hover:rgba(60,60,90,.08);
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.74);
  --spec:rgba(255,255,255,.85);--edge:rgba(0,0,0,.09);--ring:rgba(255,255,255,.55);
  --shadow:0 10px 30px rgba(40,30,80,.16),0 2px 6px rgba(40,30,80,.08);
  --op:#eef5ff;--op-ring:rgba(0,113,227,.16);
  --bg:
    radial-gradient(60% 50% at 12% 8%,#ffd9a8 0,transparent 70%),
    radial-gradient(55% 55% at 90% 10%,#ffb3c7 0,transparent 70%),
    radial-gradient(70% 60% at 80% 95%,#9cc4ff 0,transparent 70%),
    radial-gradient(60% 60% at 8% 92%,#c9b6ff 0,transparent 70%),
    linear-gradient(160deg,#ffe6cf,#f4d5ee 45%,#cfe0ff);
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme=dark]{
  --accent:#0a84ff;--link:#6cb4ff;--orange:#ffb340;--purple:#d79bff;--red:#ff7a72;
  --text:#f5f5f7;--text2:rgba(245,245,247,.72);--text3:rgba(245,245,247,.5);
  --card:#232328;--card2:#2c2c33;--sep:rgba(255,255,255,.1);--hover:rgba(255,255,255,.08);
  --glass:rgba(38,36,52,.52);--glass-strong:rgba(44,42,60,.7);
  --spec:rgba(255,255,255,.22);--edge:rgba(0,0,0,.45);--ring:rgba(255,255,255,.14);
  --shadow:0 12px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --op:#1d2a40;--op-ring:rgba(10,132,255,.28);
  --bg:
    radial-gradient(60% 50% at 12% 8%,#6b3a5a 0,transparent 70%),
    radial-gradient(55% 55% at 90% 10%,#7a3358 0,transparent 70%),
    radial-gradient(70% 60% at 80% 95%,#1f4a8a 0,transparent 70%),
    radial-gradient(60% 60% at 8% 92%,#3b2a7a 0,transparent 70%),
    linear-gradient(160deg,#1b1530,#141a33 55%,#0d1428);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:14.5px/1.5 var(--font);color:var(--text);background:var(--bg) fixed;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
[data-theme=dark] :focus-visible{outline-color:#6cb4ff}
kbd{font:600 11px var(--font);padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--text2);box-shadow:inset 0 0 0 .5px var(--sep)}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--spec),inset 0 -1px 0 var(--edge),0 0 0 .5px var(--ring),var(--shadow);
}
.shell{position:fixed;inset:0;display:flex;gap:12px;padding:14px}
.sidebar{width:230px;flex:none;border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:8px 10px 10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand i{width:24px;height:24px;border-radius:8px;display:block;background:linear-gradient(145deg,#ff9f0a,#ff375f 60%,#bf5af2);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.search{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 10px 6px 12px;background:var(--card2);box-shadow:inset 0 0 0 .5px var(--sep);margin-bottom:8px;color:var(--text2);cursor:pointer;font-size:14px}
.search:hover{background:var(--hover)}
.search .txt{flex:1}
.search:focus-visible{outline:2.5px solid var(--accent)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;cursor:pointer;font-weight:550;transition:background .15s var(--ease),transform .15s var(--ease)}
.nav button:hover{background:var(--hover)}
.nav button:active{transform:scale(.98)}
.nav button:focus-visible{outline:2.5px solid var(--accent)}
.nav button[aria-current=page]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.nav .ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
.nav .ic svg{width:17px;height:17px}
.badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--link);background:rgba(10,113,227,.12);flex:none}
.avatar.agent{border-radius:9px;color:var(--purple);background:rgba(138,63,201,.13)}
[data-theme=dark] .avatar{background:rgba(10,132,255,.2)}
[data-theme=dark] .avatar.agent{background:rgba(191,90,242,.2)}
.me small{display:block;color:var(--text2);font-size:12px;line-height:1.2}
.label{font-size:11px;color:var(--text2);padding:0 4px 3px}

.seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--card2);box-shadow:inset 0 0 0 .5px var(--sep);position:relative}
.seg button{all:unset;box-sizing:border-box;position:relative;z-index:1;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:color .2s}
.seg button[aria-pressed=true],.seg button[aria-checked=true]{color:var(--text)}
.seg button:focus-visible{outline:2.5px solid var(--accent)}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:999px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:left .25s var(--ease),width .25s var(--ease)}

.main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.toolbar{position:absolute;z-index:5;top:0;left:0;right:0;margin:0 auto;max-width:860px;border-radius:999px;padding:6px 8px 6px 18px;display:flex;align-items:center;gap:10px}
.toolbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .sp{flex:1}
.gbtn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card2);box-shadow:inset 0 0 0 .5px var(--sep);transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .15s}
.gbtn:hover{background:var(--hover)}
.gbtn:active{transform:scale(.95)}
.gbtn:focus-visible{outline:2.5px solid var(--accent)}
.gbtn[aria-pressed=true]{background:rgba(10,113,227,.14);color:var(--link)}
.gbtn.primary{background:var(--accent);color:#fff;box-shadow:none}
.gbtn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.gbtn svg{width:16px;height:16px}
.round{width:32px;height:32px;padding:0;justify-content:center}
.scroll{flex:1;overflow:auto;padding:64px 8px 40px;scroll-behavior:smooth}
.col{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
.scroll::-webkit-scrollbar{width:0}
.pageh{font-size:28px;font-weight:800;letter-spacing:-.025em;margin:6px 6px 0}
.sub{margin:0 6px;color:var(--text2);font-size:13.5px}
.screen{animation:enter .2s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* grouped lists */
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 .5px var(--sep)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:9px 16px 9px 10px;background:var(--card);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 20px rgba(30,20,70,.08),0 0 0 .5px var(--sep);transition:transform .2s var(--ease),box-shadow .2s}
.li:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(30,20,70,.16),0 0 0 .5px var(--sep)}
.li .body{flex:1;min-width:0}
.li h3{margin:0;font-size:15px;font-weight:620;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li h3 a{color:var(--text);text-decoration:none}
.li h3 a:hover{text-decoration:underline}
.li h3 a:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
.li.plain{padding:10px 14px}
.li .end{font-size:12.5px;color:var(--text2);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:0 10px;align-items:center;font-size:12.5px;color:var(--text2);margin-top:1px}
.meta .pin{color:var(--orange);font-weight:600}
.need{display:inline-flex;align-items:center;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:18px;background:#d70015;color:#fff}
.meta .rc{display:inline-flex;align-items:center;gap:3px}
.who{font-weight:600;color:var(--text)}
.ag{color:var(--purple);margin-left:3px;font-size:.9em}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--card2)}

/* votes */
.vote{display:inline-flex;align-items:center;flex:none}
.vote button{all:unset;box-sizing:border-box;display:grid;place-items:center;cursor:pointer;color:var(--text2);font-weight:700;transition:transform .2s cubic-bezier(.3,1.8,.5,1),color .15s,background .15s}
.vote button:hover{color:var(--link);background:rgba(10,113,227,.12)}
.vote button:active{transform:scale(.8)}
.vote button:focus-visible{outline:2.5px solid var(--accent)}
.vote output{font-weight:800;font-variant-numeric:tabular-nums;text-align:center;display:block}
.vote.v{flex-direction:column;width:34px}
.vote.v button{width:34px;height:15px;font-size:9px;border-radius:7px}
.vote.v output{font-size:13.5px;line-height:1.1}
.vote.h{background:var(--card2);border-radius:999px;padding:1px;box-shadow:inset 0 0 0 .5px var(--sep)}
.vote.h button{min-width:28px;height:24px;border-radius:999px;font-size:11.5px}
.vote.h output{min-width:26px;font-size:13px}
.vote.big{padding:3px}
.vote.big button{min-width:38px;height:32px;font-size:13px}
.vote.big output{min-width:44px;font-size:24px}
.vote.spring{animation:spring .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes spring{0%{transform:scale(1)}35%{transform:scale(1.1,.94)}70%{transform:scale(.98,1.03)}100%{transform:scale(1)}}

/* thread */
.thead{margin:4px 6px 0}
.crumb{font-size:13px;color:var(--text2);font-weight:600}
.crumb a{color:var(--text2);text-decoration:none}.crumb a:hover{text-decoration:underline}
.ttitle{font-size:30px;font-weight:800;letter-spacing:-.028em;line-height:1.15;margin:4px 0 4px}
.tmeta{font-size:13px;color:var(--text2);display:flex;gap:4px 12px;flex-wrap:wrap}
.owner{display:flex;gap:8px;flex-wrap:wrap;margin:4px 6px 2px;position:relative;align-items:center}
.gbtn.pin[aria-pressed=true]{color:var(--orange);background:var(--card2)}
.ttl{display:flex;align-items:center;gap:6px}
.ttl .pencil{all:unset;cursor:pointer;flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:999px;color:var(--text2);font-size:17px;opacity:0;transition:opacity .15s,background .15s}
.ttl:hover .pencil,.ttl .pencil:focus-visible{opacity:1}
.ttl .pencil:hover{background:var(--hover);color:var(--text)}
.ttl .pencil:focus-visible{outline:2.5px solid var(--accent)}
@media (hover:none){.ttl .pencil{opacity:1}}
.ttl input{flex:1;font:800 30px/1.15 var(--font);letter-spacing:-.028em;color:var(--text);background:var(--card);border:0;border-radius:12px;padding:2px 10px;box-shadow:0 0 0 2px var(--accent);min-width:0}
.msgcard{position:relative;background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 .5px var(--sep)}
.msgcard.op{background:var(--op);padding:18px 20px;box-shadow:0 0 0 1px var(--op-ring);font-size:16px;line-height:1.6}
.oplabel{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--link);margin-bottom:6px}
.msgcard.pending{box-shadow:0 0 0 1px rgba(215,0,21,.4)}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--text2)}
.head .avatar{width:24px;height:24px;font-size:11px}
.head .avatar.agent{border-radius:8px}
/* 7. score top right; stepper on hover */
.msgcard .head{padding-right:64px}
.vwrap{position:absolute;top:10px;right:12px;display:inline-flex;align-items:center;justify-content:flex-end;min-height:26px}
.vscore{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:999px;background:var(--card2);box-shadow:inset 0 0 0 .5px var(--sep);font-weight:750;font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;transition:opacity .15s}
.vscore::before{content:"\25B2\A\25BC";white-space:pre;font-size:7px;line-height:7px;color:var(--text2)}
.vwrap .vote{position:absolute;right:0;top:0;bottom:0;margin:auto 0;height:max-content;opacity:0;pointer-events:none;transition:opacity .15s}
.msgcard:hover .vwrap .vote,.vwrap:focus-within .vote{opacity:1;pointer-events:auto}
.msgcard:hover .vscore,.vwrap:focus-within .vscore{opacity:0}
@media (hover:none){.vwrap{position:static;margin-left:auto}.msgcard .head{padding-right:0}.vwrap .vote{position:static;margin:0;opacity:1;pointer-events:auto}.vscore{display:none}}
.msgcard .txt{margin-top:6px}
.txt p{margin:0 0 .6em}.txt p:last-child{margin:0}
.txt ul,.txt ol{margin:.2em 0 .6em;padding-left:1.4em}
.txt code{font-family:var(--mono);font-size:.9em;background:var(--card2);padding:1px 5px;border-radius:6px}
.txt pre{font-family:var(--mono);font-size:13px;background:var(--card2);padding:10px 12px;border-radius:10px;overflow:auto;margin:.3em 0 .6em;line-height:1.5}
.mention{color:var(--link);font-weight:650}
.foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:28px}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.rx{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;border:0;font-size:13px;font-weight:650;background:var(--card2);box-shadow:inset 0 0 0 1px transparent;transition:transform .25s cubic-bezier(.3,1.7,.5,1),background .2s,box-shadow .2s}
.rx:hover{transform:translateY(-1px) scale(1.05)}
.rx:active{transform:scale(.92)}
.rx.mine{background:rgba(10,113,227,.14);box-shadow:inset 0 0 0 1px var(--accent)}
.rx:focus-visible{outline:2.5px solid var(--accent)}
.rx .n{font-variant-numeric:tabular-nums}
.hov{display:inline-flex;gap:2px;margin-left:auto;opacity:0;transition:opacity .15s}
.msgcard:hover .hov,.msgcard:focus-within .hov,.hov.open{opacity:1}
@media (hover:none){.hov{opacity:1}}
.link{all:unset;cursor:pointer;font-size:13px;font-weight:650;color:var(--text2);padding:3px 9px;border-radius:999px;white-space:nowrap}
.link:hover{background:var(--card2);color:var(--text)}
.link:focus-visible{outline:2.5px solid var(--accent)}
.replies-h{font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);margin:12px 6px 0}
.children{margin-left:16px;padding-left:14px;border-left:1px solid var(--sep);display:flex;flex-direction:column;gap:10px;margin-top:10px}
.att-thumb{display:inline-flex;align-items:center;gap:10px;margin-top:10px;padding:5px 12px 5px 5px;border-radius:12px;background:var(--card2);font-size:13px;font-weight:600}
.att-thumb i{width:52px;height:38px;border-radius:8px;background:linear-gradient(135deg,#e5d8cc,#d6c3d8 50%,#c2d3ea);display:block}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s var(--ease)}
.expand.open{grid-template-rows:1fr}
.expand>div{overflow:hidden;min-height:0}
.inline-composer{margin-top:10px;display:flex;gap:8px;align-items:flex-end}
textarea{font:inherit;color:var(--text)}
.inline-composer textarea{flex:1;min-height:44px;resize:vertical;border:0;border-radius:14px;padding:9px 12px;background:var(--card2);box-shadow:inset 0 0 0 .5px var(--sep)}
textarea::placeholder{color:var(--text3)}
[data-theme=light] textarea::placeholder{color:#6b6b72}
[data-theme=dark] textarea::placeholder{color:#a0a0aa}
textarea:focus-visible{outline:2.5px solid var(--accent)}

.compose{position:absolute;z-index:5;left:0;right:0;bottom:6px;margin:0 auto;max-width:720px;border-radius:999px;padding:6px 6px 6px 8px;display:flex;gap:8px;align-items:center;background:var(--glass-strong)}
.compose textarea{flex:1;height:34px;min-height:34px;resize:none;border:0;background:transparent;padding:7px 6px;line-height:20px;outline:0}
.compose:focus-within{outline:2.5px solid var(--accent)}

/* popovers */
.pop{position:absolute;z-index:20;min-width:210px;border-radius:16px;padding:6px;transform-origin:top left;animation:popin .2s cubic-bezier(.3,1.4,.5,1);background:var(--glass-strong)}
@keyframes popin{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.pop button{all:unset;box-sizing:border-box;display:block;width:100%;padding:7px 11px;border-radius:10px;cursor:pointer;font-weight:550;font-size:14px}
.pop button:hover,.pop button:focus-visible{background:var(--accent);color:#fff;outline:0}
.pop hr{border:0;border-top:.5px solid var(--sep);margin:4px 6px}
.pop .cap{font-size:11px;color:var(--text2);padding:4px 11px;font-weight:650}
.tapback{position:fixed;z-index:60;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--glass-strong);transform-origin:bottom left;animation:tap .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes tap{from{opacity:0;transform:translateY(8px) scale(.6)}to{opacity:1;transform:none}}
.tapback button{all:unset;box-sizing:border-box;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.8,.5,1),background .15s}
.tapback button:hover,.tapback button:focus-visible{transform:scale(1.25) translateY(-3px);background:var(--hover);outline:0}
.tapback button.on{background:rgba(10,113,227,.18)}
.tapback button.plus{font-size:16px;font-weight:700;color:var(--text2)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:70;border-radius:999px;padding:8px 16px;font-weight:650;animation:enter .2s var(--ease);background:var(--glass-strong)}
.mentions{position:fixed;z-index:60;min-width:260px;border-radius:14px;padding:5px;background:var(--glass-strong);animation:popin .15s var(--ease);transform-origin:bottom left}
.mentions div{padding:6px 10px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;line-height:1.3}
.mentions small{color:var(--text2);font-size:12px}
.mentions div[aria-selected=true]{background:var(--accent);color:#fff}
.mentions div[aria-selected=true] small{color:rgba(255,255,255,.85)}

/* inspector */
.insp{position:fixed;right:14px;top:66px;bottom:14px;z-index:25;width:280px;border-radius:26px;padding:16px 16px 76px;overflow:auto;display:flex;flex-direction:column;gap:2px;animation:enter .2s var(--ease)}
.insp h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin:16px 0 7px;font-weight:750}
.insp h3:first-child{margin-top:2px}
.insp .grp{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 .5px var(--sep);font-size:13.5px}
.insp .grp p{margin:0}
.insp .ppl{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.insp .ppl+.ppl{border-top:.5px solid var(--sep)}
.insp .ppl small{display:block;color:var(--text2);font-size:12px;line-height:1.35}
.insp .stack{display:flex;flex-direction:column;gap:6px}
.insp .stack .gbtn{justify-content:flex-start;border-radius:10px;width:100%}
.insp .kv{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);padding:2px 0}
.insp .kv b{color:var(--text);font-weight:600}
.insp::-webkit-scrollbar{width:0}

/* new thread sheet */
.sheet{position:fixed;z-index:50;width:min(480px,94vw);border-radius:22px;padding:16px;background:var(--glass-strong);transform-origin:top right;animation:popin .24s cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:17px;letter-spacing:-.01em}
.sheet .fld{display:flex;flex-direction:column;gap:4px;position:relative}
.sheet .fld>label,.sheet .fld>span.fl{font-size:12px;font-weight:650;color:var(--text2)}
.sheet input.tin,.sheet textarea{border:0;border-radius:12px;padding:9px 12px;font:inherit;color:var(--text);background:var(--card2);box-shadow:inset 0 0 0 .5px var(--sep);width:100%}
.sheet input.tin::placeholder{color:var(--text3)}
[data-theme=light] .sheet input.tin::placeholder{color:#6b6b72}
[data-theme=dark] .sheet input.tin::placeholder{color:#a0a0aa}
.sheet input.tin:focus-visible{outline:2.5px solid var(--accent)}
.sheet textarea{min-height:110px;resize:vertical}
.apick{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border-radius:12px;background:var(--card2);box-shadow:inset 0 0 0 .5px var(--sep);cursor:pointer}
.apick:hover{background:var(--hover)}
.apick:focus-visible{outline:2.5px solid var(--accent)}
.apick .chev{margin-left:auto;color:var(--text2);font-size:12px}
.adrop{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:5;border-radius:16px;padding:6px;background:var(--glass-strong);animation:popin .18s var(--ease);transform-origin:top left}
.sheet .adrop{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card);box-shadow:0 0 0 .5px var(--ring),0 12px 32px rgba(0,0,0,.22)}
.adrop input{all:unset;box-sizing:border-box;width:100%;padding:7px 10px;font-size:14px;border-bottom:.5px solid var(--sep);margin-bottom:4px;color:var(--text)}
.adrop input::placeholder{color:var(--text2)}
.adrop .opt{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}
.adrop .opt .tile{width:30px;height:30px;font-size:15px;border-radius:9px}
.adrop .opt .tx{flex:1;min-width:0;line-height:1.3}
.adrop .opt .tx b{font-weight:620}
.adrop .opt .tx small{display:block;color:var(--text2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adrop .opt .ct{font-size:12px;color:var(--text2);white-space:nowrap}
.adrop .opt[aria-selected=true]{background:var(--accent);color:#fff}
.adrop .opt[aria-selected=true] small,.adrop .opt[aria-selected=true] .ct{color:rgba(255,255,255,.9)}
.sheet .row2{display:flex;align-items:center;gap:8px}
.sheet .row2 .hintx{font-size:12px;color:var(--text2);flex:1}
.tile.c-orange{background:rgba(255,159,10,.2)}.tile.c-blue{background:rgba(10,132,255,.17)}.tile.c-green{background:rgba(48,209,88,.2)}.tile.c-purple{background:rgba(191,90,242,.18)}

/* palette */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(20,20,30,.22);display:flex;justify-content:center;align-items:flex-start;padding-top:13vh;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.palette{width:min(580px,92vw);border-radius:20px;overflow:hidden;background:var(--glass-strong);animation:popin .2s cubic-bezier(.3,1.3,.5,1);transform-origin:top center;box-shadow:inset 0 .5px 0 var(--spec),0 0 0 .5px var(--ring),0 18px 50px rgba(0,0,0,.25)}
.pin-row{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:.5px solid var(--sep);color:var(--text2)}
.pin-row input{all:unset;flex:1;height:50px;font-size:18px;color:var(--text)}
.pin-row input::placeholder{color:var(--text2)}
.pin-row>svg{width:18px;height:18px;flex:none}
.palette .res{max-height:360px;overflow:auto;padding:6px}
.palette .grp-l{font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);padding:8px 10px 3px}
.palette .it{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;cursor:pointer}
.palette .it .pi{width:22px;height:22px;display:grid;place-items:center;flex:none;color:var(--text2)}
.palette .it .pi svg{width:16px;height:16px}
.palette .it .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette .it small{color:var(--text2);font-size:12px;white-space:nowrap}
.palette .it[aria-selected=true]{background:var(--accent);color:#fff}
.palette .it[aria-selected=true] .pi,.palette .it[aria-selected=true] small{color:rgba(255,255,255,.9)}
.palette .none{padding:22px;text-align:center;color:var(--text2)}
.palette .pfoot{display:flex;gap:14px;padding:7px 14px;border-top:.5px solid var(--sep);font-size:12px;color:var(--text2)}

.vtag{position:fixed;left:30px;top:0;z-index:40;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 10px;border-radius:0 0 8px 8px;pointer-events:none;color:var(--text);background:var(--glass-strong)}

@media (max-width:1100px){
  .insp{position:fixed;right:14px;top:66px;bottom:14px;z-index:25;background:var(--glass-strong)}
}
@media (max-width:1000px){
  .sidebar{width:62px;padding:10px 7px;border-radius:24px}
  .brand span,.nav .t,.search .txt,.search kbd,.me span,.label,.seg-theme .tx{display:none}
  .search{justify-content:center;padding:8px 0}
  .nav button{justify-content:center;padding:8px 0;position:relative}
  .nav .badge{position:absolute;top:-2px;right:-2px;margin:0;font-size:10px;min-width:16px;line-height:16px;padding:0 4px}
  .brand{justify-content:center;padding:6px 0 10px}
  .me{justify-content:center}
  .seg-theme{flex-direction:column;border-radius:16px}
  .seg-theme button{padding:3px 4px;font-size:11px;text-align:center}
  .seg-theme .thumb{display:none}
  .seg-theme button[aria-checked=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .vtag{left:16px}
}
@media (max-width:820px){.toolbar #sortSeg{display:none}.ttitle{font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</div>

<script src="fixtures.js"></script>
<script>
(function(){
